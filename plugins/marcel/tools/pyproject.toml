[project]
name = "marcel-tools"
version = "0.1.0"
description = "Marcel brain tools: an MCP server the brain session uses to drive the hub."
requires-python = ">=3.12"
# Standard library only: the server runs with the NUC's python3, no install.
dependencies = []

[project.scripts]
marcel-tools = "marcel_tools.server:main"

[dependency-groups]
# The hub is a dev dependency only: the tests drive every tool against the real hub app in-process.
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8", "pytest-cov>=5", "jsonschema>=4.23", "pyyaml>=6", "marcel-hub"]

[tool.uv.sources]
marcel-hub = { path = "../../../hub", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marcel_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "../scripts"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: reaches a real claude, network or device; never part of the gate"]

[tool.coverage.run]
source = ["marcel_tools", "../scripts"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

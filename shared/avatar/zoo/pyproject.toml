[project]
name = "marcel-avatar-zoo"
version = "0.1.0"
description = "Pixel Zoo: old-school pixel avatars and their sprite sheets. The package has no dependencies; tests need jsonschema."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoo"]

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8", "pytest-cov>=5", "jsonschema>=4.23"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.12"
include = ["zoo", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=zoo --cov-report=term-missing:skip-covered --cov-fail-under=90"

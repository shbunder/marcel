[project]
name = "marcel-avatar-pixel"
version = "0.1.0"
description = "Builds Marcel's pixel-art giraffe sprite sheet. The build has no dependencies; tests need jsonschema."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8", "jsonschema>=4.23"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.12"
include = ["build.py", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

openapi: 3.1.0
info:
  title: Marcel hub — session API
  version: 0.1.7
  description: |
    The two hub endpoints that Claude Code sessions call themselves, over HTTPS through the tunnel.
    They sit under the same `/api` server as the app API but use their own tokens, never a device
    token:

    - **adopt** (`/marcel-adopt`, B-14): any session the owner hands over. Token: the adopt token in
      `~/.marcel/adopt-token` on the owner's machines.
    - **report** (cloud workers, B-10, SP3): a cloud worker cannot reach the channel, so it reports its
      progress and result here. Token: a per-task token, put in the worker's prompt, valid for that
      one task and for 48 hours from when it was minted. The hub mints a new token for the spawn and
      for each follow-up message it sends the task; the earlier tokens of the same task stay valid
      until the task finishes. Every token of a task is refused once the task is `done`, `failed`
      or `stopped` (clarified in 0.1.4).

    Scanners probed the tunnel within minutes during SP3: anything without a valid token gets 404,
    not 401. Wrong tokens are rate-limited per caller address, and a caller limited for wrong tokens
    gets 404 on both routes (a 429 would show that the route exists). The right token is always
    accepted, so a stranger cannot lock the owner or a worker out. `report` answers 429
    `too_many_reports` only to a valid token that sends too fast (0.1.5).

    - **session-end** (0.1.6, S-05.8, ADR-010): the marcel plugin's `Stop` and `SessionEnd` hooks, in
      every NUC session. This one route is **not** under `/api` and not reachable through the tunnel:
      it sits on the hub's NUC port next to `/channel` (its own `servers` entry), and a request
      carrying Cloudflare's `cf-connecting-ip` header is answered 404 `not_found`. It is
      authenticated like the channel: the hub secret and a session id the runner reported.
servers:
  - url: https://marcel-bot.com/api

paths:
  /channel/session-end:
    servers:
      - url: http://127.0.0.1:7420
        description: The hub's port on the NUC, outside `/api` (like `/channel`)
    post:
      operationId: sessionEnded
      summary: A NUC session stopped a turn or ended (the plugin's `Stop` and `SessionEnd` hooks).
      description: |
        `event: stop`: the session is about to finish a turn; the hook asks whether it owes a report.
        `event: session_end`: the session ended; `reason` is the `SessionEnd` hook's own (`clear`,
        `logout`, `prompt_input_exit`, `other`, …).

        `report_owed` is true only for a worker whose task is `working` or `needs_you` with no
        `done` or `failed` report since its last prompt; for a brain, side or adopted session it is
        always false. On `session_end` from such a worker, or from a worker whose task is `silent`
        (`report_owed` is false for it, but its session ending is the sign it waited for), the hub
        moves the task to `failed` with a reason that starts `ended_without_report` and names the
        hook's end reason (task-states.md), and tells the brain like any failed task. When the task
        already ended (the worker reported, or the runner's poll got there first), or the session
        is a brain, side or adopted one, the end reason is only written to the hub's log: no task
        event and nothing in the app (0.1.7). The hooks never block on the answer: a hub that does
        not answer means "nothing owed".
      security:
        - secret: []
          session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionEnd' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEndAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Exactly like the channel's `rejected`: the secret does not match (`bad_secret`), or the
            runner never reported this session and it was not adopted (`unknown_session`).
          content:
            application/json:
              schema: { $ref: 'app-api.yaml#/components/schemas/Error' }
        '404':
          description: 'A request that came through the tunnel (`cf-connecting-ip` set): `not_found`, as if there were no route.'
          content:
            application/json:
              schema: { $ref: 'app-api.yaml#/components/schemas/Error' }
        '503':
          description: The hub has no secret, so it refuses every session (`no_secret`). Redeploy to write it.
          content:
            application/json:
              schema: { $ref: 'app-api.yaml#/components/schemas/Error' }

  /session/adopt:
    post:
      operationId: adoptSession
      summary: Hand the calling Claude Code session to Marcel.
      security:
        - adopt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptRequest' }
      responses:
        '201':
          description: Adopted; Marcel posts "Adopted <title>" in the main conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adopted' }
        '200':
          description: This session was already adopted; the existing task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adopted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/Hidden' }

  /session/report:
    post:
      operationId: reportProgress
      summary: A cloud worker reports progress, an artifact, or its end.
      security:
        - task: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Report' }
      responses:
        '202':
          description: Recorded on the task named by the token.
          content:
            application/json:
              schema:
                type: object
                required: [task_id]
                additionalProperties: false
                properties:
                  task_id: { type: string }
                example: { task_id: tsk_01J9ZQ5 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/Hidden' }
        '409':
          description: |
            A `note` that was not kept; nothing was stored. `too_many_notes`: this task already sent
            10 `note` reports (new in 0.1.2). `notes_full`: the project's notes file would pass 1 MB,
            the memory file cap (new in 0.1.4). The worker puts the fact in its done summary instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            `too_many_reports`: this task's valid token sent reports faster than the hub takes them
            (new in 0.1.5). Wait and send again. Never sent for a wrong token, which gets 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: |
            `memory_unavailable`: a `note` could not be kept (the hub has no notes folder, git failed,
            or the task's project has no usable notes file). Nothing was stored; the worker puts the
            fact in its done summary instead. New in 0.1.4.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    adopt:
      type: http
      scheme: bearer
      description: The owner's adopt token.
    task:
      type: http
      scheme: bearer
      description: The per-task token from the worker's prompt.
    secret:
      type: apiKey
      in: header
      name: X-Marcel-Secret
      description: The hub secret (`$CLAUDE_PLUGIN_DATA/hub-secret`), as the channel's `hello` carries it. New in 0.1.6.
    session:
      type: apiKey
      in: header
      name: X-Marcel-Session
      description: The caller's `CLAUDE_CODE_SESSION_ID` (the hook input's `session_id`). New in 0.1.6.

  responses:
    BadRequest:
      description: |
        The body is not valid; `message` says what to change. A `note` with no text, text of only
        spaces, or more than 1000 characters is `bad_note`; a `progress` report whose `next` breaks
        its bounds is `bad_next`; any other invalid report is `bad_report` (codes named in 0.1.4).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Hidden:
      description: Missing, wrong, expired or spent token — deliberately indistinguishable from "no such route".
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooMany:
      description: Rate limited.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SessionEnd:
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event:
          type: string
          enum: [stop, session_end]
        reason:
          type: string
          minLength: 1
          maxLength: 64
          description: For `session_end`, the `SessionEnd` hook's `reason`, passed on unchanged. New values may appear.
      example: { event: session_end, reason: prompt_input_exit }

    SessionEndAnswer:
      type: object
      required: [report_owed]
      additionalProperties: false
      properties:
        report_owed:
          type: boolean
          description: True when this worker should still call `report(done)` or `report(failed)`.
      example: { report_owed: true }

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }
      example: { code: not_found, message: Not found. }

    AdoptRequest:
      type: object
      required: [session_id, kind, title]
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: '`CLAUDE_CODE_SESSION_ID` for a local session; `session_…` for a cloud one.'
        kind: { type: string, enum: [local, cloud] }
        title: { type: string, minLength: 1, maxLength: 120 }
        cwd: { type: string, description: For a local session. }
        machine: { type: string, description: Hostname, for a local session. }
        url: { type: string, format: uri, description: The session's claude.ai page, when known. }
      example:
        session_id: 6f1c2a9e-8b7d-4c3a-9e2f-0a1b2c3d4e5f
        kind: local
        title: Refactor the Harry digest renderer
        cwd: /home/shbunder/projects/harry
        machine: bunderserver

    Adopted:
      type: object
      required: [task_id, tracked]
      additionalProperties: false
      properties:
        task_id: { type: string }
        tracked:
          type: string
          enum: [live, links_only]
          description: |
            `live`: the session is on the NUC, so the runner tails it and its state is followed.
            `links_only`: it runs elsewhere (another machine or the cloud); Marcel keeps the link
            and its reports, nothing more.
      example: { task_id: tsk_01J9ZT9, tracked: live }

    Report:
      type: object
      description: |
        What a worker reports (the same payload reaches the hub as a channel `report` frame from a
        NUC worker). Each kind but `note` becomes a milestone on the task.

        `note` (new in 0.1.2) is one durable fact that later threads in the same project need ("The
        Luminus contract ends on 1 March 2027"), in plain words, at most 1000 characters. The hub
        appends `- <date> <text> (from <task title>)` to `memory/projects/<slug>.md` of the task's
        project (the Inbox's notes, `memory/projects/inbox.md`, for an unfiled task), commits it as
        `memory: projects/<slug>.md (worker <task id>)`, and posts nothing in the main chat. A note never
        changes the task's state. At most 10 notes per task: past that the hub answers
        `too_many_notes` (409 here, a `call_ack` error on the channel) and stores nothing. A note is
        also refused, with nothing stored, as `notes_full` (409: the project's notes would pass
        1 MB), `memory_unavailable` (503: the notes cannot be saved now) or `bad_note` (400: no
        text, only spaces, or more than 1000 characters). Each refusal's message tells the worker
        to put the fact in its done summary instead (codes named in 0.1.4).
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [started, progress, artifact, done, failed, note]
        text:
          type: string
          description: |
            For `progress`, one line. Reports are milestones, not a running commentary. For `note`,
            the fact (1 to 1000 characters, at least one of them not a space; 0.1.4).
        next:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
          description: |
            For `progress`: the steps still planned, in order, after `text`. Each progress report
            replaces the previous list (app-api.yaml `ProgressEventData.next`). New in 0.1.1.
        summary:
          type: string
          description: For `done` and `failed`, one or two sentences for the milestone.
        artifact: { $ref: '#/components/schemas/ReportedArtifact' }
        artifacts:
          type: array
          description: For `done`, everything worth keeping.
          items: { $ref: '#/components/schemas/ReportedArtifact' }
      allOf:
        - if: { properties: { kind: { const: progress } } }
          then: { required: [text] }
        - if: { properties: { kind: { const: note } } }
          then:
            required: [text]
            properties: { text: { minLength: 1, maxLength: 1000, pattern: '\S' } }
        - if: { properties: { kind: { const: artifact } } }
          then: { required: [artifact] }
        - if: { properties: { kind: { enum: [done, failed] } } }
          then: { required: [summary] }
      example:
        kind: done
        summary: The test raced the session cookie. Added a wait on the cookie and a regression test.
        artifacts:
          - { kind: pr, title: 'Fix flaky login test: wait on the session cookie', url: 'https://github.com/shbunder/marcel/pull/14' }

    ReportedArtifact:
      type: object
      required: [kind, title, url]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [pr, branch, link]
          description: A cloud worker can only hand over things that live at a URL.
        title: { type: string }
        url: { type: string, format: uri }
      example: { kind: branch, title: claude/fix-flaky-login, url: 'https://github.com/shbunder/marcel/compare/claude/fix-flaky-login' }

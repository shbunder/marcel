        goal: { type: string }
        repo: { type: string }
        folder: { type: string }
        instructions: { type: string }
        claude_project_url: { type: string, format: uri }
      example: { agent_id: agt_marcel, name: Garden, goal: Plan the spring planting and order the seeds. }

    ProjectUpdate:

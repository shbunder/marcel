    ScheduleLocation:
      type: string
      description: '`brain`: Marcel itself runs it (digests). `nuc` / `cloud`: a worker task is started at fire time.'
      enum: [brain, nuc, cloud]
      example: brain

    Schedule:
      type: object
      required: [id, agent_id, name, cron, tz, location, prompt, paused, builtin]
      additionalProperties: false
      properties:
        id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        cron:
          type: string
          description: Five-field cron, in `tz`.
        tz:
          type: string
          description: IANA time zone.
        location: { $ref: '#/components/schemas/ScheduleLocation' }
        prompt: { type: string }
        paused: { type: boolean }
        builtin:
          type: boolean
          description: |
            True for the four digests; they can be paused, not deleted. Their ids are
            `sch_digest_<digest>_<agent id>` (`morning`, `evening`, `weekly`, `usage`), so each agent
            has its own four.
        deadline_minutes:
          type: integer
          minimum: 1
          description: Say so if no run has started this long after the fire time (B-23).
        last_run_at: { type: string, format: date-time }
        next_run_at: { type: string, format: date-time }
      example:
        id: sch_digest_morning_agt_marcel
        agent_id: agt_marcel
        name: Morning digest
        cron: '0 7 * * *'
        tz: Europe/Brussels
        location: brain
        prompt: Write the morning digest from the facts bundle.
        paused: false
        builtin: true
        deadline_minutes: 30
        next_run_at: '2026-10-05T05:00:00Z'


openapi: 3.1.0
info:
  title: Marcel hub — app API
  version: 0.7.0
  description: |
    The API the iPhone app uses to talk to the hub on the NUC. **Every path, including `/health`,
    `/pair` and `/ws`, sits under the server URL** (`https://marcel-bot.com/api/...`); the tunnel
    exposes `/api/*` and nothing else of the app's. Every route needs a device token
    (`Authorization: Bearer <token>`), except `/health` and `/pair`.

    Live updates arrive over one WebSocket per device, `GET /ws?since=<event id>` (see that path).
    Its frames are defined in `events.schema.json`; their payloads reuse the schemas below. Code
    generators do not read that file, so the app writes the event types by hand from it.

    Push notifications carry a `PushNotification` payload, and the pairing QR code encodes a
    `PairingCode` URL; both are defined below as schemas.

    Errors always have the `Error` shape, with a `message` written for the person holding the phone.
    Lists are paginated by cursor: pass `cursor` from the previous page's `next_cursor`.

    **People** (new in 0.7.0, B-37…B-40). Every device belongs to one person (`Me.role`): the
    `owner`, who runs Marcel at home, or a `member` of the family. Each person sees only their own
    agents and everything under them. Operations marked `x-owner-only: true` are the owner's alone;
    a member gets 403 `owner_only` with a message that says to ask the owner. Answering a
    self-change approval card is owner-only too (`POST /approvals/{approval_id}`).

    **0.7.0 is additive.** Every field it adds to an existing schema is optional, so a hub that
    does not fill it yet still matches; the operations it adds are served story by story.
servers:
  - url: https://marcel-bot.com/api
    description: Production, through the Cloudflare tunnel
  - url: http://127.0.0.1:7420/api
    description: On the NUC
security:
  - device: []

tags:
  - name: access
  - name: agents
  - name: conversations
  - name: projects
  - name: tasks
  - name: approvals
  - name: artifacts
  - name: memory
  - name: schedules
  - name: usage
  - name: people
  - name: mentions

paths:
  /health:
    get:
      tags: [access]
      operationId: getHealth
      summary: Is the hub up, and can it reach the runner?
      security: []
      responses:
        '200':
          description: The hub answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /ws:
    get:
      tags: [access]
      operationId: openEventStream
      summary: The live event stream (WebSocket upgrade). Frames are defined in events.schema.json.
      description: |
        Authenticate with the same `Authorization: Bearer` header as REST. The first frame is
        `hello` (or `resync.required` if `since` is older than the hub keeps, higher than any id it
        sent, or not a number; the socket is not refused, because a refused socket reads as
        "unpaired" on the phone). After that, every
        frame is an event with an `id` one higher than the last; `hello` and `resync.required`
        use `id: 0` and are not part of that sequence.
      parameters:
        - name: since
          in: query
          description: The last event id you processed. Omit on first connect.
          schema: { type: integer, minimum: 0 }
      responses:
        '101':
          description: Switching protocols; events follow.
        '403':
          description: |
            No device token, or a revoked one. A refused WebSocket upgrade answers 403 with no
            body (that is what ASGI servers send when the hub closes before accepting), so unlike
            REST this is not 401. The app treats it as unpaired, like a REST 401.

  /pair:
    post:
      tags: [access]
      operationId: pairDevice
      summary: Exchange a one-time pairing code (from the QR code) for a device token.
      description: |
        `marcel-hub pair` prints a QR code holding a `PairingCode` URL. The app reads `hub` from it
        as its server URL and sends `code` here. A code works once, for 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '201':
          description: Paired. The token is shown once; the hub stores only its hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: |
            Too many wrong codes in the last minute (code `too_many_tries`). Pairing is refused for the
            rest of that minute, so a code cannot be guessed. Wait and scan a fresh code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me:
    get:
      tags: [access]
      operationId: getMe
      summary: Who this device belongs to, and that person's agents.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices:
    get:
      tags: [access]
      operationId: listDevices
      summary: Devices paired to this user.
      responses:
        '200':
          description: All devices, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [access]
      operationId: revokeDevice
      summary: Revoke a device. Its token stops working at once.
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{device_id}/push:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    put:
      tags: [access]
      operationId: setDevicePush
      summary: Register where this device receives notifications (APNs token or ntfy topic).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTarget' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [people]
      operationId: listUsers
      summary: Everyone who uses this Marcel, with their helper. Owner only. New in 0.7.0.
      x-owner-only: true
      responses:
        '200':
          description: The owner first, then members by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OwnerOnly' }
    post:
      tags: [people]
      operationId: addUser
      summary: Add a family member and their helper. Owner only. New in 0.7.0.
      description: |
        Stores the person as a `member`, with their own agent (`agent.name`, and `agent.look`, or a
        look picked from the agent's name when absent), main conversation and Inbox. Pair their
        first phone with `POST /users/{user_id}/pairing-codes`.
      x-owner-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OwnerOnly' }

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [people]
      operationId: removeUser
      summary: Remove a family member. Owner only. New in 0.7.0.
      description: |
        Their phones are signed out at once (their tokens answer 401), their running quests stop,
        and their helper is archived: no brain, no schedules, no digests. Their chats, items and
        notes stay on the NUC.
      x-owner-only: true
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OwnerOnly' }
        '404':
          description: No such person (code `user_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`cannot_remove_owner`: the owner cannot be removed. Nothing changed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{user_id}/pairing-codes:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [people]
      operationId: createPairingCode
      summary: A one-time code that pairs a phone to this person. Owner only. New in 0.7.0.
      description: |
        The same kind of code `marcel-hub pair` prints: it works once, for 10 minutes, with
        `POST /pair`, and the phone it pairs belongs to `user_id`. Show `link` as a QR code, or share
        it as a link.
      x-owner-only: true
      responses:
        '201':
          description: A fresh code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedPairingCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OwnerOnly' }
        '404':
          description: No such person (code `user_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgent
      summary: One agent, with its current state for the avatar.
      description: Only the caller's own agent; another person's answers 404, like one that does not exist.
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: Rename an agent, change its look, or finish onboarding.
      description: |
        Only for the caller's own agent; another person's answers 404. A change sends the
        `agent.updated` event. A rename also tells the agent's brain its new name (channel
        `system_event` `agent_renamed`), so it answers to it without a restart. `look` and
        `onboarded` are new in 0.7.0; `palette` is deprecated and ignored once the agent has a `look`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agent_id}/brain/rollover:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    post:
      tags: [agents]
      operationId: rollOverBrain
      summary: Give Marcel a fresh main session now (a manual rollover). New in 0.6.0.
      description: |
        The hub starts a new brain with Marcel's notes and recent context, and hands the
        conversation over when it says hello (channel-protocol.md § Brain rollover). The
        `brain.rollover` event (reason `manual`) follows once the hand-over is done.
      responses:
        '202': { description: Started; the `brain.rollover` event follows. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`rollover_running`: a rollover is already waiting for its new session to say hello.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`runner_unreachable`: the hub cannot start a session just now. Nothing changed.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agents/{agent_id}/brain/rollovers:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: listBrainRollovers
      summary: Marcel's past rollovers, newest first (for the notebook). New in 0.6.0.
      description: |
        The same facts as each `brain.rollover` event, kept apart from the event log so a rollover
        from before this phone was listening is still shown. `[]` before the first one.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Rollovers, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rollover' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agents/{agent_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [agents]
      operationId: getAgentAvatar
      summary: The agent's avatar sprite sheet, built from its look. New in 0.7.0.
      description: |
        Two bodies at one URL, picked by the `Accept` header: `application/json` (the default) is the
        sheet's JSON, an `avatar-sheet.schema.json` document; `image/png` is the sheet's image
        (the JSON's `image` names it, but fetch it here). Both carry the same `ETag`, which changes
        with the look and equals `avatar_etag` in the `agent.updated` event; send it back as
        `If-None-Match` to get 304 when nothing changed.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The sheet.
          headers:
            ETag:
              description: Changes when the look changes.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                description: An `avatar-sheet.schema.json` document (kept out of this file so code generators read it as plain JSON).
                example:
                  version: 1
                  name: fox
                  palette: tangerine
                  image: fox-tangerine-cheerful.png
                  frame: { width: 32, height: 32 }
                  columns: 8
                  frame_count: 12
                  loops:
                    idle: [[0, 1800], [1, 120], [0, 2400]]
                    thinking: [[2, 400], [3, 400]]
                    working1: [[4, 140], [5, 140]]
                    working2: [[6, 140], [7, 140]]
                    working3: [[8, 140], [9, 140]]
                    needs_you: [[10, 500], [0, 500]]
                    done: [[11, 600], [0, 400]]
            image/png:
              schema: { type: string, contentMediaType: image/png }
        '304': { description: 'Not modified: `If-None-Match` matched the current `ETag`.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /avatar-previews:
    get:
      tags: [agents]
      operationId: getAvatarPreview
      summary: One 32×32 frame of a look, for the look picker. New in 0.7.0.
      description: |
        Any look, not only an agent's: the picker shows a live preview while the person chooses.
        `mood` defaults to the personality's resting mood. Cached; the same query gives the same image.
      parameters:
        - name: animal
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LookAnimal' }
        - name: color
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LookColor' }
        - name: personality
          in: query
          required: true
          schema: { $ref: '#/components/schemas/LookPersonality' }
        - name: mood
          in: query
          schema: { $ref: '#/components/schemas/Mood' }
      responses:
        '200':
          description: A 32×32 PNG.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: The main conversation and every side thread of an agent.
      description: An agent that does not exist or is not yours gives an empty list, so the answer does not reveal which agents exist.
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Main first, then side threads, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [conversations]
      operationId: listMessages
      summary: Messages, newest first. Page backwards with `cursor`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [conversations]
      operationId: sendMessage
      summary: Send a message. It never blocks on Marcel being busy (B-02).
      description: |
        Returns as soon as the message is stored. Marcel's answer arrives later as a
        `message.created` event. `client_id` makes retries safe: the same `client_id` returns the
        same message instead of a duplicate. With `artifact_id` ("Ask about this", B-21) the item
        is attached: the stored message carries it, and Marcel is told which item it is about; an
        unknown item answers 404 `artifact_not_found`. New in 0.5.0.

        With `mentions` (new in 0.7.0, B-42), each one must be the caller's own quest, project or
        item, or the message is refused with 404 `mention_not_found` and nothing is stored. The
        stored message carries them, with the hub's current titles, and Marcel gets them too. A
        `project` mention also sets the message's `project_id` when the message has none.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A task thread whose task is `stopped` or `failed` (code `task_finished`). See `Conversation.task_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      tags: [conversations]
      operationId: getMessage
      summary: One message by id, in any of your conversations. New in 0.5.0.
      description: |
        For a `marcel://message/<id>` deep link that arrives before the live stream has the
        message: `conversation_id` says whether it is in the main conversation or a side thread.
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such message, or one in another person's conversation (code `message_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/{message_id}/thread:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [conversations]
      operationId: openSideThread
      summary: Reply in thread — open (or reopen) the side thread on a message (B-08).
      description: |
        Idempotent: a message has at most one side thread, and calling this again returns it.
        If the message is a milestone or approval about a task, replies go straight to that task
        instead (see `Conversation.task_id`).
      responses:
        '200':
          description: The side thread that already existed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: A new side thread.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversation_id}/send-to-main:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [conversations]
      operationId: sendToMain
      summary: Bring a result from a side thread back into the main conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendToMain' }
      responses:
        '201':
          description: The message as posted in the main conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /mentions:
    get:
      tags: [mentions]
      operationId: searchMentions
      summary: Quests, projects and items to mention, for `@` and `#` in the composer. New in 0.7.0.
      description: |
        The caller's own quests (`task`), projects and items (`artifact`) whose title contains `q`
        (any case), newest first, at most 20. An empty or absent `q` lists the newest. `@` asks for
        `task` and `artifact`, `#` for `project`.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/MentionKind' }
      responses:
        '200':
          description: At most 20 matches, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items: { $ref: '#/components/schemas/Mention' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasks (threads) for the Quests tab, optionally for one project.
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          description: Repeat to ask for several states.
          schema:
            type: array
            items: { $ref: '#/components/schemas/TaskState' }
          style: form
          explode: true
        - name: archived
          in: query
          description: List archived tasks instead of live ones.
          schema: { type: boolean, default: false }
        - name: project_id
          in: query
          description: Only this project's tasks (B-30).
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page, most recent activity first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{task_id}/events:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: listTaskEvents
      summary: The live transcript of a task, oldest first (B-11).
      parameters:
        - name: after
          in: query
          description: Return events with a `seq` greater than this. Omit to start at the beginning.
          schema: { type: integer, minimum: 0 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page. Keep calling with `after = last seq` until `has_more` is false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{task_id}/messages:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: steerTask
      summary: Type into a task directly (B-11). No brain turn is spent.
      description: |
        The text is delivered into the session and recorded as a `note` task event
        (`author: user`). A `queued` or `starting` task gets it as soon as its session is up;
        a `done` task takes it as a follow-up and goes back to `working`. A `stopped` or `failed`
        task answers 409 `task_finished`: ask Marcel to retry instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '202':
          description: Queued for the session. Delivered as soon as it is connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{task_id}/stop:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: stopTask
      summary: Stop a task. A queued task is removed from the queue.
      responses:
        '200':
          description: The task, now `stopped` (or already finished).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: |
            The runner did not answer, so the task was not stopped (code `runner_unreachable`). It is
            left as it was: marking it `stopped` could hide a session that is still running. Try again
            once the runner is back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tasks/{task_id}/archive:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: archiveTask
      summary: Archive a finished task, so it leaves the Quests tab (B-17). Its artifacts stay.
      description: Only for `done`, `failed` or `stopped` tasks; anything else answers 409. Archived tasks are listed with `archived=true`.
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/{task_id}/move:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks, projects]
      operationId: moveTask
      summary: File a task under another project (B-31). A hub-only change; Marcel is not woken.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskMove' }
      responses:
        '200':
          description: Moved. A `task.moved` event follows, and both projects' boards are rebuilt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The target project is archived (code `project_archived`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tasks/{task_id}/handback:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: handBackTask
      summary: Hand a task back to Marcel, who decides what happens next.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: What you want Marcel to know.
              additionalProperties: false
              example: { note: 'Looks stuck on the flaky test, try another approach.' }
      responses:
        '202':
          description: Marcel has been told.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approval cards, open ones first.
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ApprovalState' }
      responses:
        '200':
          description: Approvals.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /approvals/{approval_id}:
    parameters:
      - name: approval_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [approvals]
      operationId: getApproval
      summary: One approval by id, in any state. New in 0.5.0.
      description: |
        For a `marcel://approval/<id>` deep link: the approval names its task, and still answers
        once `GET /approvals` no longer lists it.
      responses:
        '200':
          description: The approval as it stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such approval (code `approval_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [approvals]
      operationId: answerApproval
      summary: Approve or deny (B-12). The first answer wins, from the app or a terminal.
      description: |
        A self-change card (`tool: self_change`, B-24) is answered by the owner only; a member gets
        403 `owner_only` (new in 0.7.0).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalAnswer' }
      responses:
        '200':
          description: Answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OwnerOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already answered (for example in a terminal) or expired. The body is the approval as it stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }

  /artifacts:
    get:
      tags: [artifacts]
      operationId: listArtifacts
      summary: The Items tab (B-21), newest change first; optionally for one project or task.
      parameters:
        - name: task_id
          in: query
          schema: { type: string }
        - name: project_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ArtifactKind' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getArtifact
      summary: One artifact's metadata.
      responses:
        '200':
          description: The artifact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /artifacts/{artifact_id}/content:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getArtifactContent
      summary: The artifact's bytes, with its own content type. Not available for `pr` and `link`.
      parameters:
        - name: version
          in: query
          description: An older version (B-34). Absent means the current one.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The content.
          content:
            '*/*':
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /artifacts/{artifact_id}/versions:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: listArtifactVersions
      summary: Every version of a living artifact, newest first (B-34).
      responses:
        '200':
          description: All versions; there are few, so there is no paging.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ArtifactVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /artifacts/{artifact_id}/move:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    post:
      tags: [artifacts, projects]
      operationId: moveArtifact
      summary: Pin an item to another project (B-21, B-31), like moving a task. New in 0.5.0.
      description: |
        A hub-only change; Marcel is not woken. The item keeps its versions and its task; only
        `project_id` changes. Moving it to the project it is in already answers 200 and changes
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactMove' }
      responses:
        '200':
          description: Moved. An `artifact.moved` event follows, and both projects' boards are rebuilt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The target project is archived (code `project_archived`), or the item is a project's
            `board`, which stays with its project (code `artifact_is_board`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: The Map (B-30). The `inbox` project always exists.
      description: |
        Every agent has exactly one project with slug `inbox`, named "Inbox", created with the agent. Threads
        that fit no other project land there (B-31). It cannot be archived. The examples use the id
        `prj_inbox`; real ids are chosen by the hub.
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
        - name: archived
          in: query
          description: List archived projects instead of live ones.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Live projects, the one with the most recent activity first; `inbox` last.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
              example:
                - id: prj_01JA0A1
                  agent_id: agt_marcel
                  slug: energy
                  name: Energy contracts
                  goal: Find a cheaper gas and electricity contract before the renewal on 1 December.
                  board_artifact_id: art_01JA0A2
                  archived: false
                  counts: { working: 1, needs_you: 1, done_7d: 2 }
                  created_at: '2026-10-08T19:00:00Z'
                  updated_at: '2026-10-12T08:14:00Z'
                - id: prj_01J9ZM1
                  agent_id: agt_marcel
                  slug: marcel-dev
                  name: Marcel dev
                  goal: Build and look after Marcel itself.
                  repo: shbunder/marcel
                  board_artifact_id: art_01J9ZM2
                  archived: false
                  counts: { working: 1, needs_you: 0, done_7d: 4 }
                  created_at: '2026-10-04T18:00:00Z'
                  updated_at: '2026-10-12T07:50:00Z'
                - id: prj_inbox
                  agent_id: agt_marcel
                  slug: inbox
                  name: Inbox
                  board_artifact_id: art_01J9ZM0
                  archived: false
                  counts: { working: 0, needs_you: 1, done_7d: 3 }
                  created_at: '2026-10-04T17:00:00Z'
                  updated_at: '2026-10-12T08:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project. Its notes file and its board are created with it (B-33, B-35).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProject' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A live project with this slug exists (code `slug_taken`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      summary: One project, for its room.
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Rename it, change its goal, repo, folder, standing instructions or Claude Code link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: archiveProject
      summary: Archive a project with no live tasks. Its items and notes stay readable.
      description: '`inbox` cannot be archived, and neither can a project with tasks that are not done, failed or stopped; both answer 409.'
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /memory:
    get:
      tags: [memory]
      operationId: getMemoryTree
      summary: Every memory file (B-20).
      responses:
        '200':
          description: The tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryTree' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: The memory store could not run (code `memory_unavailable`). Nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /memory/files/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: |
          A Markdown file's path inside the memory repo, with `/` encoded as `%2F` so it is one
          path segment (e.g. `MEMORY.md`, `memory%2F2026-10-04.md`). After decoding it must match
          the pattern: letters, digits, `.`, `_`, `-` and `/`, ending in `.md`, never `..`, never
          starting with `/`, and no part starting with `.` (so `.git/` is unreachable). Anything
          else answers 400 `invalid_memory_path`.
        schema:
          type: string
          pattern: '^(?!/)(?!.*\.\.)(?!(.*/)?\.)[A-Za-z0-9._/-]+\.md$'
          example: MEMORY.md
    get:
      tags: [memory]
      operationId: getMemoryFile
      summary: One memory file. The `ETag` header is the body's `etag` in quotes, as HTTP wants.
      description: |
        A file over 1 MB (written straight to disk) is not read: 400 `memory_file_too_big`.
      responses:
        '200':
          description: The file.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The memory store could not run (code `memory_unavailable`). Nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [memory]
      operationId: putMemoryFile
      summary: Save a memory file. Send `If-Match` with the etag you read; omit it to create a new file.
      description: |
        With `If-Match`: saved only if the file's current etag matches, else 409 with the current
        version. Without `If-Match`: creates the file; if it already exists, 409 with the current
        version, never a silent overwrite. Every save is one git commit. `If-Match` may be the bare
        etag, quoted, or `W/`-prefixed; clients should send the **bare** etag, because generated
        clients (swift-openapi-generator) URI-encode header values, which turns the quotes into
        `%22`. A file over 1 MB is refused: 400 `memory_file_too_big`.

        A failed `If-Match` is **409 with the current version in the body**, not HTTP's usual 412:
        deliberate, so the app can show both versions without a second read. Hub and app follow
        this together; never change one side alone.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryWrite' }
      responses:
        '200':
          description: Saved and committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Changed elsewhere since you read it. The body is the current version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryFile' }
        '404':
          description: '`If-Match` names a file that was removed since you read it (code `memory_file_not_found`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The memory store could not run (code `memory_unavailable`). Nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: Every schedule, including the built-in digests (B-22).
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Schedules, by next run.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Create a schedule. (Usually Marcel does this from the conversation.)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSchedule' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /schedules/{schedule_id}:
    parameters:
      - name: schedule_id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [schedules]
      operationId: updateSchedule
      summary: Pause, resume or change a schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a schedule. Built-in digests can be paused but not deleted.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such schedule (`schedule_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`schedule_builtin`: a built-in digest; it can be paused, not deleted.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /usage:
    get:
      tags: [usage]
      operationId: getUsage
      summary: Plan usage and whether the usage guard is holding work back (B-19).
      responses:
        '200':
          description: The latest reading.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: |
            No reading yet (code `no_reading`): the runner has not read plan usage since it started,
            or the hub has no runner. The app shows "usage unavailable". New in 0.5.0.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    device:
      type: http
      scheme: bearer
      description: The device token from `POST /pair`.

  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque. Pass `next_cursor` from the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: The request was not valid. `message` says what to change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No device token, or a revoked one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nothing with that id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OwnerOnly:
      description: |
        `owner_only`: only the owner may do this (new in 0.7.0). The `message` says so in plain
        words, e.g. "Only Shaun can add people. Ask Shaun to do it."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The thing is not in a state that allows this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Stable, for code; the app may match on it. The hub uses: `unauthorized` (401),
            `bad_request` (400), `not_found` (404), `method_not_allowed` (405), `internal_error` (500);
            pairing: `pairing_code_invalid`, `pairing_code_used`, `pairing_code_expired`,
            `too_many_tries` (429); devices: `device_not_found`; conversations:
            `conversation_not_found`, `message_not_found`, `bad_cursor`, `already_main`; approvals:
            `approval_not_found`; tasks:
            `task_not_found`, `task_not_finished`, `task_finished`, `runner_unreachable` (503);
            projects: `slug_taken`, `project_archived`, `project_is_inbox`, `project_busy`,
            `agent_not_found`; agents: `rollover_running` (409); artifacts and memory:
            `artifact_not_found`, `artifact_is_board`, `invalid_memory_path`,
            `memory_file_not_found`, `memory_file_too_big`, `memory_unavailable` (503); schedules:
            `schedule_not_found` (404), `schedule_builtin` (409); usage: `no_reading` (503); people
            (0.7.0): `owner_only` (403), `user_not_found` (404), `cannot_remove_owner` (409);
            mentions (0.7.0): `mention_not_found` (404). New codes may be added; treat an unknown
            code by its HTTP status.
        message:
          type: string
          description: For people. Short, says what happened and what to do.
      example:
        code: pairing_code_expired
        message: That pairing code has expired. Run `marcel-hub pair` again for a new one.

    Health:
      type: object
      required: [ok, version, runner]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        version: { type: string }
        runner:
          type: object
          required: [reachable]
          additionalProperties: false
          properties:
            reachable: { type: boolean }
            reason:
              type: string
              description: Why not, when `reachable` is false.
        brain_alive: { type: boolean }
      example:
        ok: true
        version: 0.1.0
        runner: { reachable: true }
        brain_alive: true

    PairRequest:
      type: object
      required: [code, device_name]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 6, maxLength: 12 }
        device_name: { type: string, minLength: 1, maxLength: 80 }
      example: { code: K7Q2M9, device_name: Shaun's iPhone }

    PairResponse:
      type: object
      required: [device_id, token, user_id]
      additionalProperties: false
      properties:
        device_id: { type: string }
        user_id: { type: string }
        token:
          type: string
          description: Store it in the Keychain. It is never shown again.
      example:
        device_id: dev_01J9ZQ4K2B
        user_id: usr_owner
        token: mrc_4f8e0c1d9a7b46e2b3c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b

    Me:
      type: object
      required: [user_id, name, device_id, agents, push]
      additionalProperties: false
      properties:
        user_id: { type: string }
        name: { type: string }
        role:
          $ref: '#/components/schemas/UserRole'
          description: New in 0.7.0. The app shows People only to the owner.
        device_id: { type: string }
        agents:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
        push:
          type: object
          description: |
            Which push backends the hub can use. Register APNs only when `apns` is true;
            otherwise subscribe to an ntfy topic on `ntfy_server` and register that (B-18).
          required: [apns, ntfy]
          additionalProperties: false
          properties:
            apns: { type: boolean }
            ntfy: { type: boolean }
            ntfy_server: { type: string, format: uri }
          if: { properties: { ntfy: { const: true } } }
          then: { required: [ntfy_server] }
      example:
        user_id: usr_owner
        name: Shaun
        device_id: dev_01J9ZQ4K2B
        push: { apns: false, ntfy: true, ntfy_server: 'https://ntfy.sh' }
        agents:
          - id: agt_marcel
            name: Marcel
            animal: giraffe
            palette: marcel
            seed: Marcel
            main_conversation_id: cnv_main_marcel
            state: { kind: working, active_tasks: 2 }
            model_brain: opus
            model_worker: sonnet

    UserRole:
      type: string
      description: '`owner`: runs Marcel at home and whose Claude login the NUC uses (B-37). `member`: a family member the owner added.'
      enum: [owner, member]
      example: member

    User:
      type: object
      description: A person, as the owner's People screen shows them (B-37, B-40). New in 0.7.0.
      required: [id, name, role, created_at, device_count, quests_this_week]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
        role: { $ref: '#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }
        agent:
          type: object
          description: The person's helper. Absent only while it is still being set up.
          required: [id, name]
          additionalProperties: false
          properties:
            id: { type: string }
            name: { type: string }
            look: { $ref: '#/components/schemas/Look' }
        device_count:
          type: integer
          minimum: 0
          description: Phones paired to this person and not revoked.
        quests_this_week:
          type: integer
          minimum: 0
          description: Quests their helper started in the last 7 days.
      example:
        id: usr_01JA3E1
        name: Emma
        role: member
        created_at: '2026-10-13T17:20:00Z'
        agent:
          id: agt_01JA3E2
          name: Pip
          look: { animal: fox, color: tangerine, personality: cheerful }
        device_count: 1
        quests_this_week: 3

    NewUser:
      type: object
      required: [name, agent]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        agent:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 40 }
            look:
              $ref: '#/components/schemas/Look'
              description: Picked from the agent's name when absent.
      example:
        name: Emma
        agent: { name: Pip, look: { animal: fox, color: tangerine, personality: cheerful } }

    IssuedPairingCode:
      type: object
      required: [code, link, expires_at]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{6,12}$' }
        link:
          $ref: '#/components/schemas/PairingCode'
          description: The same code as a `marcel://pair` link, for the QR code and for sharing.
        expires_at:
          type: string
          format: date-time
          description: 10 minutes after it was made; the app shows the time left.
      example:
        code: R4T8WZ
        link: marcel://pair?hub=https%3A%2F%2Fmarcel-bot.com%2Fapi&code=R4T8WZ
        expires_at: '2026-10-13T17:31:00Z'

    PushTarget:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [apns, ntfy] }
        apns_token:
          type: string
          pattern: '^[0-9a-fA-F]{64,200}$'
          description: |
            Required when `kind` is `apns`. The device token from APNs, hex-encoded (64 to 200 hex
            digits); anything else is 400 `bad_request`, because Apple answers `BadDeviceToken` to it.
            Pattern new in 0.6.0.
        ntfy_topic:
          type: string
          description: Required when `kind` is `ntfy`.
      allOf:
        - if: { properties: { kind: { const: apns } } }
          then: { required: [apns_token] }
        - if: { properties: { kind: { const: ntfy } } }
          then: { required: [ntfy_topic] }
      example: { kind: ntfy, ntfy_topic: marcel-shaun-7f3a }

    Device:
      type: object
      required: [id, name, created_at, push]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        push:
          type: string
          enum: [apns, ntfy, none]
        current:
          type: boolean
          description: True for the device making this request.
      example:
        id: dev_01J9ZQ4K2B
        name: Shaun's iPhone
        created_at: '2026-10-04T18:02:11Z'
        last_seen_at: '2026-10-04T18:40:00Z'
        push: ntfy
        current: true

    AgentState:
      type: object
      description: |
        What the avatar shows (B-28), in precedence order: `needs_you` if any task is
        `needs_you` (an approval, a question, a login); else `working` with n = tasks `working`;
        else `thinking` while the brain runs a turn; else `done` for 5 s after a completion;
        else `idle`.
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [idle, thinking, working, needs_you, done]
        active_tasks:
          type: integer
          minimum: 0
          description: Number of working tasks. Required when `kind` is `working`.
      if: { properties: { kind: { const: working } } }
      then: { required: [active_tasks] }
      example: { kind: working, active_tasks: 3 }

    Agent:
      type: object
      required: [id, name, animal, main_conversation_id, state, model_brain, model_worker]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        look:
          $ref: '#/components/schemas/Look'
          description: |
            How the avatar looks (B-44, ADR-008); the source of truth for the avatar. Its sheet is
            `GET /agents/{agent_id}/avatar`. New in 0.7.0.
        animal:
          type: string
          readOnly: true
          description: |
            A read-only copy of `look.animal` (since 0.7.0). Before 0.7.0, a recipe in
            `shared/avatar/recipes/`.
        palette:
          type: string
          deprecated: true
          description: Deprecated in 0.7.0 (use `look.color`). A palette id from `shared/avatar/palettes.json`.
        seed:
          type: string
          deprecated: true
          description: Deprecated in 0.7.0. Fed the old avatar's deterministic details (spots, blink timing).
        onboarded_at:
          type: string
          format: date-time
          description: |
            When the person finished "Meet your helper" after pairing (`AgentUpdate.onboarded`).
            Absent until then, and the app shows onboarding. New in 0.7.0.
        main_conversation_id:
          type: string
          description: Where to send messages to this agent's main conversation.
        state: { $ref: '#/components/schemas/AgentState' }
        model_brain: { type: string }
        model_worker: { type: string }
      example:
        id: agt_marcel
        name: Marcel
        animal: giraffe
        palette: marcel
        seed: Marcel
        main_conversation_id: cnv_main_marcel
        state: { kind: idle }
        model_brain: opus
        model_worker: sonnet

    AgentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        look:
          $ref: '#/components/schemas/Look'
          description: New in 0.7.0. Replaces the whole look; `animal` follows it.
        onboarded:
          type: boolean
          const: true
          description: New in 0.7.0. Sets `onboarded_at` the first time; sending it again changes nothing.
        palette:
          type: string
          deprecated: true
          description: Deprecated in 0.7.0 (use `look`).
      example: { name: Pip, look: { animal: fox, color: tangerine, personality: cheerful } }

    Look:
      type: object
      description: |
        An avatar from the Pixel Zoo (B-44, ADR-008): an animal, a colour and a personality. The
        same look always draws the same avatar. New in 0.7.0.
      required: [animal, color, personality]
      additionalProperties: false
      properties:
        animal: { $ref: '#/components/schemas/LookAnimal' }
        color: { $ref: '#/components/schemas/LookColor' }
        personality: { $ref: '#/components/schemas/LookPersonality' }
      example: { animal: giraffe, color: rose, personality: professional }

    LookAnimal:
      type: string
      enum: [giraffe, crocodile, frog, cat, fox, bear, panda, rabbit, dog, pig, mouse]
      example: giraffe

    LookColor:
      type: string
      description: '`natural` keeps the animal''s own colours (a look picked from a name can be `natural`).'
      enum: [natural, rose, coral, tangerine, honey, lime, green, teal, sky, blue, lavender, plum, cocoa, sand, slate, snow, ink]
      example: rose

    LookPersonality:
      type: string
      description: Sets the accessory, the resting mood and how lively the avatar is.
      enum: [professional, cheerful, curious, cozy, bold, cool, sporty, shy, grumpy]
      example: professional

    Mood:
      type: string
      description: A face the avatar can pull (`GET /avatar-previews`). The avatar's states map onto moods.
      enum: [neutral, happy, laughing, love, excited, wink, proud, calm, thinking, idea, focused, working,
             surprised, confused, worried, sad, crying, angry, grumpy, sleepy, dizzy, embarrassed, singing,
             shocked, kiss]
      example: thinking

    Conversation:
      type: object
      required: [id, agent_id, kind, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        agent_id: { type: string }
        kind:
          type: string
          enum: [main, side]
        parent_message_id:
          type: string
          description: For a side thread, the message it was opened on.
        task_id:
          type: string
          description: |
            Set when the side thread was opened on a task's milestone or approval. Such a thread
            is the task's own: a message posted there steers the task (no brain turn, like
            `POST /tasks/{id}/messages`), and the hub mirrors that task's later milestones and
            approval cards into it (an approval card appears in the thread as well as in the main
            conversation; answering either answers both). The full transcript stays in the thread view. Posting to a thread whose task is
            `stopped` or `failed` returns 409 `task_finished`; a `done` task takes the message as
            a follow-up and goes back to `working`.
        title: { type: string }
        reply_count:
          type: integer
          minimum: 0
          description: Side threads only (0 when empty); absent on the main conversation.
        created_at: { type: string, format: date-time }
        last_message_at:
          type: string
          format: date-time
          description: Present once the conversation has a message.
      example:
        id: cnv_side_01J9ZR0
        agent_id: agt_marcel
        kind: side
        parent_message_id: msg_01J9ZQZ8
        title: Which ORM should we move to?
        reply_count: 4
        created_at: '2026-10-04T18:10:00Z'
        last_message_at: '2026-10-04T18:14:30Z'

    NewMessage:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        client_id:
          type: string
          description: Chosen by the app; makes retries safe.
        project_id:
          type: string
          description: |
            Sent from a project room (B-32). The message still goes to the main conversation; the tag
            tells Marcel which project it is about.
        artifact_id:
          type: string
          description: |
            An item attached to the message ("Ask about this" on an item, B-21). The stored message
            carries it as `artifact_id`. New in 0.5.0.
        mentions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Mention' }
          description: |
            The quests, items (`@`) and projects (`#`) picked in the composer (B-42). Each must be
            the caller's own (see `POST /conversations/{conversation_id}/messages`). New in 0.7.0.
      example: { text: Also add a test for the empty case., client_id: 7d2c9a40-1f7b-4e55-9e1a-2c3b4d5e6f70 }

    MentionKind:
      type: string
      description: '`task`: a quest (`@`). `artifact`: an item (`@`). `project`: a project (`#`).'
      enum: [task, project, artifact]
      example: task

    Mention:
      type: object
      description: A quest, project or item named in a message (B-42). New in 0.7.0.
      required: [kind, id, title]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/MentionKind' }
        id:
          type: string
          description: The task, project or artifact id.
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: The chip's text. On a stored message, the hub's title when the message was sent.
      example: { kind: task, id: tsk_01J9ZQ5, title: Fix flaky login test }

    SendToMain:
      type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      properties:
        message_id:
          type: string
          description: Quote this side-thread message into the main conversation.
        text:
          type: string
          description: Or send this text, written by you.
      example: { message_id: msg_01J9ZS3T }

    MessageRole:
      type: string
      enum: [user, agent, system]
      example: agent

    MessageKind:
      type: string
      description: |
        `text`: a normal chat bubble. `milestone`: a task started, needs you, finished or failed
        (B-06). `approval`: an approval card (B-12). `quote`: a side-thread result brought into the
        main conversation. `artifact`: an item arrived — the first version of an artifact a task made
        (B-36); later versions only update the cards already shown.
      enum: [text, milestone, approval, quote, artifact]
      example: milestone

    Milestone:
      type: object
      required: [task_id, task_title, event, location]
      additionalProperties: false
      properties:
        task_id: { type: string }
        task_title: { type: string }
        event:
          type: string
          enum: [started, queued, needs_you, done, failed, stopped, silent, adopted]
        location: { $ref: '#/components/schemas/TaskLocation' }
        summary:
          type: string
          description: One or two sentences, from the worker's own report.
        artifact_ids:
          type: array
          items: { type: string }
      example:
        task_id: tsk_01J9ZQ5
        task_title: Fix the flaky login test
        event: done
        location: cloud
        summary: The test raced the session cookie. Added a wait on the cookie and a regression test.
        artifact_ids: [art_01J9ZT1]

    Message:
      type: object
      required: [id, conversation_id, role, kind, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        conversation_id: { type: string }
        role: { $ref: '#/components/schemas/MessageRole' }
        kind: { $ref: '#/components/schemas/MessageKind' }
        text:
          type: string
          description: Markdown. Present for `text` and `quote`; optional otherwise.
        milestone: { $ref: '#/components/schemas/Milestone' }
        approval_id:
          type: string
          description: Present for `approval`. Fetch or watch the approval for its state.
        quoted_message_id:
          type: string
          description: Present for `quote`.
        artifact_id:
          type: string
          description: |
            Present for `artifact`. On a user `text` message, the item the owner attached
            (`NewMessage.artifact_id`).
        task_id: { type: string }
        project_id:
          type: string
          description: The project a user message was sent from (B-32), or the project of an `artifact` message.
        client_id: { type: string }
        reply_to_message_id:
          type: string
          description: |
            The user message this one answers (B-41): set for a brain reply that names it, and for
            a task's milestones, approval cards and items (the message that started the task). The
            app shows a small quote when it is not the person's latest message before this one. New
            in 0.7.0.
        mentions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Mention' }
          description: On a user message, what it mentions (`NewMessage.mentions`). New in 0.7.0.
        thread:
          type: object
          description: Present when this message has a side thread.
          required: [conversation_id, reply_count]
          additionalProperties: false
          properties:
            conversation_id: { type: string }
            reply_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
      allOf:
        - if: { properties: { kind: { const: text } } }
          then: { required: [text] }
        - if: { properties: { kind: { const: milestone } } }
          then: { required: [milestone, task_id] }
        - if: { properties: { kind: { const: approval } } }
          then: { required: [approval_id, task_id] }
        - if: { properties: { kind: { const: quote } } }
          then: { required: [text, quoted_message_id] }
        - if: { properties: { kind: { const: artifact } } }
          then: { required: [artifact_id, project_id] }
      example:
        id: msg_01J9ZQZ8
        conversation_id: cnv_main_marcel
        role: agent
        kind: milestone
        milestone:
          task_id: tsk_01J9ZQ5
          task_title: Fix the flaky login test
          event: started
          location: cloud
        task_id: tsk_01J9ZQ5
        created_at: '2026-10-04T18:05:02Z'

    MessagePage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        next_cursor:
          type: string
          description: Absent on the last page.
      example:
        items:
          - id: msg_01J9ZQZ1
            conversation_id: cnv_main_marcel
            role: user
            kind: text
            text: Can you fix the flaky login test in shbunder/marcel?
            client_id: 0b6f7c1e-0000-4000-8000-000000000001
            created_at: '2026-10-04T18:05:00Z'
        next_cursor: c_msg_01J9ZQZ1

    TaskState:
      type: string
      description: See `task-states.md` for every transition and who triggers it.
      enum: [queued, starting, working, needs_you, done, failed, stopped, silent, unknown]
      example: working

    TaskLocation:
      type: string
      enum: [nuc, cloud]
      example: nuc

    QueuedReason:
      type: string
      description: 'Why a task is `queued`. `cap`: the NUC concurrency cap (B-15). `usage`: the usage guard (B-19).'
      enum: [cap, usage]
      example: cap

    Task:
      type: object
      required: [id, agent_id, project_id, title, location, state, model, origin, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string }
        agent_id: { type: string }
        project_id:
          type: string
          description: Every task belongs to exactly one project; `inbox` when nothing fits (B-30).
        title: { type: string }
        location: { $ref: '#/components/schemas/TaskLocation' }
        state: { $ref: '#/components/schemas/TaskState' }
        queued_reason: { $ref: '#/components/schemas/QueuedReason' }
        model:
          type: string
          description: The worker's model, e.g. `sonnet` or `opus`.
        origin:
          type: string
          enum: [marcel, adopted, schedule]
        repo:
          type: string
          description: '`owner/name` when the task works on a repository.'
        branch: { type: string }
        session_id:
          type: string
          description: The Claude Code session id.
        cloud_url:
          type: string
          format: uri
          description: For a cloud task, its claude.ai/code page.
        remote_url:
          type: string
          format: uri
          description: |
            For a NUC task whose session is connected to Remote Control, its claude.ai/code page.
            Absent otherwise; the app then offers only the thread view.
        archived_at: { type: string, format: date-time }
        parent_message_id:
          type: string
          description: The main-conversation message that started it.
        schedule_id: { type: string }
        summary:
          type: string
          description: The worker's latest summary, once it has reported one.
        waiting_for:
          type: string
          description: For `needs_you`, what it is waiting on, in plain words.
        approval_ids:
          type: array
          items: { type: string }
          description: Open approvals on this task.
        artifact_count: { type: integer, minimum: 0 }
        expected_by:
          type: string
          format: date-time
          description: After this, silence makes the task `silent` (B-23).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
      example:
        id: tsk_01J9ZQ6
        agent_id: agt_marcel
        project_id: prj_inbox
        title: Check disk usage of all Docker volumes
        location: nuc
        state: needs_you
        model: sonnet
        origin: marcel
        session_id: 6f1c2a9e-8b7d-4c3a-9e2f-0a1b2c3d4e5f
        parent_message_id: msg_01J9ZQZ9
        waiting_for: Permission to run `docker system df -v`.
        approval_ids: [apr_01J9ZR2]
        artifact_count: 0
        created_at: '2026-10-04T18:06:00Z'
        updated_at: '2026-10-04T18:06:40Z'
        last_activity_at: '2026-10-04T18:06:40Z'

    TaskPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_cursor: { type: string }
      example:
        items:
          - id: tsk_01J9ZQ5
            agent_id: agt_marcel
            project_id: prj_01J9ZM1
            title: Fix the flaky login test
            location: cloud
            state: working
            model: sonnet
            origin: marcel
            repo: shbunder/marcel
            cloud_url: https://claude.ai/code/session_01ABCDEF
            created_at: '2026-10-04T18:05:02Z'
            updated_at: '2026-10-04T18:20:00Z'

    TaskEventType:
      type: string
      description: |
        `text`, `tool_call`, `tool_result`, `diff`, `subagent_start`, `subagent_stop`, `error`
        and `raw` are normalised from the session's transcript; their `data` is the matching
        `$defs` shape of `transcript.schema.json`, unchanged. The hub writes the rest itself, with the `data`
        shapes below: `state` (every transition), `progress` (a worker's report), `artifact`,
        `note` (a steer message or a hand-back note) and `permission` (from the channel's
        permission request, so it carries the approval id for the inline card).
      enum:
        - text
        - tool_call
        - tool_result
        - diff
        - permission
        - subagent_start
        - subagent_stop
        - error
        - raw
        - state
        - progress
        - artifact
        - note
      example: tool_call

    TaskEvent:
      type: object
      required: [task_id, seq, type, at, data]
      additionalProperties: false
      properties:
        task_id: { type: string }
        seq:
          type: integer
          minimum: 1
          description: Increases by one per event within a task. Use it to resume.
        type: { $ref: '#/components/schemas/TaskEventType' }
        at: { type: string, format: date-time }
        data:
          type: object
          description: Shape depends on `type`; see `TaskEventType`.
      allOf:
        - if: { properties: { type: { const: state } } }
          then: { properties: { data: { $ref: '#/components/schemas/StateEventData' } } }
        - if: { properties: { type: { const: progress } } }
          then: { properties: { data: { $ref: '#/components/schemas/ProgressEventData' } } }
        - if: { properties: { type: { const: artifact } } }
          then: { properties: { data: { $ref: '#/components/schemas/ArtifactEventData' } } }
        - if: { properties: { type: { const: note } } }
          then: { properties: { data: { $ref: '#/components/schemas/NoteEventData' } } }
        - if: { properties: { type: { const: permission } } }
          then: { properties: { data: { $ref: '#/components/schemas/PermissionEventData' } } }
        - if: { properties: { type: { const: text } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/Text' } } }
        - if: { properties: { type: { const: tool_call } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/ToolCall' } } }
        - if: { properties: { type: { const: tool_result } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/ToolResult' } } }
        - if: { properties: { type: { const: diff } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/Diff' } } }
        - if: { properties: { type: { const: subagent_start } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/SubagentStart' } } }
        - if: { properties: { type: { const: subagent_stop } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/SubagentStop' } } }
        - if: { properties: { type: { const: error } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/Error' } } }
        - if: { properties: { type: { const: raw } } }
          then: { properties: { data: { $ref: 'transcript.schema.json#/$defs/Raw' } } }
      example:
        task_id: tsk_01J9ZQ6
        seq: 12
        type: tool_call
        at: '2026-10-04T18:06:39Z'
        data: { tool_use_id: toolu_01VQ3n8ZkC2xH7d4Rb5Tq9Lw, tool: Bash, summary: docker system df -v }

    StateEventData:
      type: object
      required: [to, reason]
      additionalProperties: false
      properties:
        from:
          description: Absent for a new task.
          $ref: '#/components/schemas/TaskState'
        to: { $ref: '#/components/schemas/TaskState' }
        reason:
          type: string
          description: The trigger from task-states.md, in plain words.
      example: { from: working, to: needs_you, reason: 'Permission request: Bash' }

    ProgressEventData:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          description: What the worker is doing now.
        next:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
          description: |
            The steps the worker still plans, in order, after `text`; the quest view lists them
            as "· next" (wireframe 2A). Each progress event replaces the previous list; absent
            means the worker gave none, not that nothing is left. New in 0.5.0.
      example:
        text: Found the race; writing the regression test now.
        next: [Run the login tests ten times, Open the PR]

    ArtifactEventData:
      type: object
      required: [artifact_id, kind, title]
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        title: { type: string }
      example: { artifact_id: art_01J9ZT1, kind: pr, title: 'Fix flaky login test: wait on the session cookie' }

    NoteEventData:
      type: object
      required: [author, text]
      additionalProperties: false
      properties:
        author:
          type: string
          enum: [user, marcel]
          description: '`user`: typed in the thread view or a task thread. `marcel`: sent by the brain (`tasks_send`), or the task''s opening prompt.'
        text: { type: string }
        handback:
          type: boolean
          description: True when the note came with a hand-back.
        prompt:
          type: boolean
          description: True for the task's opening prompt, the first note of every task.
      example: { author: user, text: Also add a test for the empty case. }

    PermissionEventData:
      type: object
      required: [approval_id, tool, summary]
      additionalProperties: false
      properties:
        approval_id: { type: string }
        tool: { type: string }
        summary: { type: string }
      example: { approval_id: apr_01J9ZR2, tool: Bash, summary: Run `docker system df -v` }

    TaskEventPage:
      type: object
      required: [items, has_more]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskEvent' }
        has_more: { type: boolean }
      example:
        items:
          - task_id: tsk_01J9ZQ6
            seq: 1
            type: state
            at: '2026-10-04T18:06:00Z'
            data: { from: starting, to: working, reason: The runner reports the session is working }
        has_more: false

    ApprovalState:
      type: string
      description: |
        `expired`: the question went away without any answer: the session stopped, failed or
        moved past it. An answer given anywhere else (another device, or a terminal) is recorded
        as `approved` or `denied`, with `answered_via` saying where.
      enum: [open, approved, denied, expired]
      example: open

    Approval:
      type: object
      required: [id, task_id, tool, summary, state, created_at]
      additionalProperties: false
      properties:
        id: { type: string }
        task_id: { type: string }
        tool:
          type: string
          description: The Claude Code tool asking, e.g. `Bash`, `Write`, or `self_change` for a self-modification PR (B-24).
        artifact_id:
          type: string
          description: For `self_change`, the PR artifact that approving will merge.
        summary:
          type: string
          description: What it wants to do, in one line.
        detail:
          type: string
          description: The full command or diff stats, for the expanded card.
        state: { $ref: '#/components/schemas/ApprovalState' }
        answered_via:
          type: string
          enum: [app, terminal]
        created_at: { type: string, format: date-time }
        answered_at: { type: string, format: date-time }
      if: { properties: { tool: { const: self_change } } }
      then: { required: [artifact_id] }
      example:
        id: apr_01J9ZR2
        task_id: tsk_01J9ZQ6
        tool: Bash
        summary: Run `docker system df -v`
        detail: docker system df -v
        state: open
        created_at: '2026-10-04T18:06:40Z'

    ApprovalAnswer:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, deny]
        note:
          type: string
          description: Optional, with a denial. The hub sends it to the session right after the denial (channel-protocol.md § Delivery guarantees).
      example: { decision: approve }

    ArtifactKind:
      type: string
      description: |
        `pr`: a pull request. `branch`: a pushed branch with no PR yet (`url` is its compare
        page). `doc`: Markdown or HTML. `file`: anything else with bytes. `dashboard`: JSON
        matching `dashboard.schema.json`, drawn natively. `link`: any other URL. `board`: a project's
        board (B-35), a dashboard the hub keeps current; one per project.

        The agent's digest board (B-35, B-36: "the morning digest is a board artifact") is a `doc`,
        not a `board`: Marcel publishes it as Markdown in the Inbox, and each digest is a new
        version of it. `board` is only ever a project's board, built by the hub.
      enum: [pr, branch, doc, file, dashboard, link, board]
      example: pr

    Artifact:
      type: object
      required: [id, project_id, kind, title, current_version, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string }
        task_id: { type: string }
        project_id: { type: string }
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        current_version:
          type: integer
          minimum: 1
          description: Living artifacts gain versions (B-34); the fields here describe the current one.
        updated_by:
          type: string
          description: Who made the current version, in plain words (a task's title, "Marcel" or "the hub").
        title: { type: string }
        url:
          type: string
          format: uri
          description: For `pr`, `branch` and `link`.
        content_type:
          type: string
          description: For `doc`, `file` and `dashboard`; fetch the bytes from `/artifacts/{id}/content`.
        size_bytes: { type: integer, minimum: 0 }
        trusted:
          type: boolean
          default: false
          description: |
            For HTML docs: true only when the hub produced the HTML itself. The app runs
            JavaScript in a doc only when this is true.
        self_change:
          type: boolean
          default: false
          description: For `pr`, true when the PR changes Marcel itself (B-24).
        pr:
          type: object
          description: For `pr`, refreshed by the hub.
          required: [number, state]
          additionalProperties: false
          properties:
            number: { type: integer }
            state:
              type: string
              enum: [open, draft, merged, closed]
            checks:
              type: string
              enum: [pending, passing, failing, none]
            review:
              type: string
              enum: [none, requested, approved, changes_requested]
            note:
              type: [string, 'null']
              maxLength: 200
              description: |
                Why the card may be out of date, in plain words, when the hub could not refresh it
                from GitHub: "GitHub refused the token", "No GitHub token is set
                (MARCEL_GITHUB_TOKEN)", "GitHub is having trouble". Absent or null when the last
                refresh worked. New in 0.5.0.
            refreshed_at:
              type: string
              format: date-time
              description: |
                When the hub last read this PR from GitHub successfully; absent before the first good
                refresh. With `note`, the app can say since when a card is stale. A refresh that
                changes nothing else sends no event of its own: the new time rides along on the next
                `artifact.updated` (or the next read). New in 0.6.0.
          example: { number: 14, state: open, checks: pending, note: GitHub is having trouble., refreshed_at: '2026-10-04T18:25:00Z' }
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: When the current version was made.
      allOf:
        - if: { properties: { kind: { enum: [pr, branch, link] } } }
          then: { required: [url] }
        - if: { properties: { kind: { const: pr } } }
          then: { required: [pr] }
        - if: { properties: { kind: { enum: [doc, file, dashboard, board] } } }
          then: { required: [content_type] }
      example:
        id: art_01J9ZT1
        task_id: tsk_01J9ZQ5
        project_id: prj_01J9ZM1
        kind: pr
        title: 'Fix flaky login test: wait on the session cookie'
        current_version: 1
        url: https://github.com/shbunder/marcel/pull/14
        pr: { number: 14, state: open, checks: passing, review: requested }
        created_at: '2026-10-04T18:31:00Z'
        updated_at: '2026-10-04T18:31:00Z'

    ArtifactPage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        next_cursor: { type: string }
      example:
        items:
          - id: art_01JA0B1
            task_id: tsk_01JA0A9
            project_id: prj_01JA0A1
            kind: doc
            title: Energy offers compared
            current_version: 3
            updated_by: Energy contracts
            content_type: text/markdown
            size_bytes: 3120
            created_at: '2026-10-09T20:00:00Z'
            updated_at: '2026-10-12T08:14:00Z'
          - id: art_01JA0A2
            project_id: prj_01JA0A1
            kind: board
            title: Energy contracts — board
            current_version: 7
            updated_by: the hub
            content_type: application/json
            created_at: '2026-10-08T19:00:00Z'
            updated_at: '2026-10-12T08:14:05Z'

    ArtifactVersion:
      type: object
      required: [artifact_id, version, created_at]
      additionalProperties: false
      properties:
        artifact_id: { type: string }
        version: { type: integer, minimum: 1 }
        summary:
          type: string
          description: What changed in this version, in one line.
        author:
          type: string
          description: Who made it, in plain words (a task's title, "Marcel" or "the hub").
        task_id: { type: string }
        url: { type: string, format: uri }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
      example:
        artifact_id: art_01JA0B1
        version: 3
        summary: Added the Engie offer; Luminus is still the cheapest.
        author: Energy contracts
        task_id: tsk_01JA0A9
        content_type: text/markdown
        size_bytes: 3120
        created_at: '2026-10-12T08:14:00Z'

    Project:
      type: object
      required: [id, agent_id, slug, name, board_artifact_id, archived, counts, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string }
        agent_id: { type: string }
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,39}$'
          description: Used in `marcel://project/<slug>` and for the notes file `memory/projects/<slug>.md`.
        name: { type: string, minLength: 1, maxLength: 60 }
        goal:
          type: string
          description: One line on what the project is for.
        repo:
          type: string
          description: '`owner/name` when its coding threads work on one repository.'
        folder:
          type: string
          description: A folder on the NUC its threads work in.
        instructions:
          type: string
          description: Standing instructions every thread in the project starts with (Markdown).
        claude_project_url:
          type: string
          format: uri
          description: A linked Claude Code Project (B-33a); informational in v1.
        board_artifact_id:
          type: string
          description: The project's board (B-35), an artifact of kind `board`.
        tracker_url:
          type: string
          format: uri
          pattern: '^https://'
          description: |
            A coding project's tracker (B-46), a page readable on the phone and the laptop. Set when
            a worker reports a `link` artifact with `role: tracker` (channel.schema.json `Artifact`);
            a later one replaces it. New in 0.7.0.
        archived: { type: boolean }
        counts:
          type: object
          required: [working, needs_you, done_7d]
          additionalProperties: false
          properties:
            working: { type: integer, minimum: 0 }
            needs_you: { type: integer, minimum: 0 }
            done_7d:
              type: integer
              minimum: 0
              description: Tasks finished in the last 7 days.
        created_at: { type: string, format: date-time }
        updated_at:
          type: string
          format: date-time
          description: The last change to the project or anything in it.
      example:
        id: prj_01JA0A1
        agent_id: agt_marcel
        slug: energy
        name: Energy contracts
        goal: Find a cheaper gas and electricity contract before the renewal on 1 December.
        board_artifact_id: art_01JA0A2
        archived: false
        counts: { working: 1, needs_you: 1, done_7d: 2 }
        created_at: '2026-10-08T19:00:00Z'
        updated_at: '2026-10-12T08:14:00Z'

    NewProject:
      type: object
      required: [agent_id, name]
      additionalProperties: false
      properties:
        agent_id: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,39}$'

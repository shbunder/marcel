        cron: '0 8 * * 1'
        tz: Europe/Brussels
        location: cloud
        prompt: List outdated dependencies in shbunder/marcel and shbunder/harry, and open one PR per repo.
        deadline_minutes: 120

    ScheduleUpdate:

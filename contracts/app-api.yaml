      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        cron: { type: string }
        tz: { type: string }
        prompt: { type: string, minLength: 1 }
        paused: { type: boolean }
        deadline_minutes: { type: integer, minimum: 1 }
      example: { paused: true }

    Rollover:
      type: object
      description: One past brain rollover; the `brain.rollover` event's `data`, with its id and time.
      required: [id, agent_id, at, reason, kept]
      additionalProperties: false
      properties:
        id: { type: string }
        agent_id: { type: string }
        at: { type: string, format: date-time }
        reason:
          type: string
          enum: [context_full, crashed, daily, manual]
          description: As events.schema.json `brain.rollover`.
        kept:
          type: string
          description: What the new session started with, in plain words.
      example:
        id: rol_01JA2C4
        agent_id: agt_marcel
        at: '2026-10-12T04:00:00Z'

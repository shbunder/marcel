    PairingCode:
      type: string
      description: |
        What the pairing QR code encodes: a URL `marcel://pair?hub=<server URL, URL-encoded>&code=<code>`.
        The app keeps `hub` as its server URL and posts `code` to `/pair` on it.
      pattern: '^marcel://pair\?hub=[^&]+&code=[A-Z0-9]{6,12}$'
      example: marcel://pair?hub=https%3A%2F%2Fmarcel-bot.com%2Fapi&code=K7Q2M9

    PushNotification:
      type: object
      description: |
        The payload of every push, the same for APNs and ntfy (B-16, B-18). On APNs, `title` and
        `body` go in `aps.alert`, `category` is the APNs category, `collapse_key` is
        `apns-collapse-id`, and the rest sits beside `aps`. On ntfy they map to Title, the message,
        Tags and a Click action set to `deep_link`.

        Deep links: `marcel://task/<task id>`, `marcel://message/<message id>`,
        `marcel://approval/<approval id>`, `marcel://artifact/<artifact id>`,
        `marcel://project/<project slug>` (`Project.slug`), and `marcel://status` (the app's system
        status screen, showing `GET /health`) for a push about no one task. The app reads the target
        with `GET /tasks/{id}`, `GET /messages/{id}`, `GET /approvals/{id}`, `GET /artifacts/{id}`
        or `GET /projects`.

        An `approval` push on APNs has two actions on the `approval` category, with the action
        identifiers `approve` and `deny`; the app answers them with `POST /approvals/{id}`
        (`decision` `approve` or `deny`) using its own token. ntfy pushes only open
        the deep link, so no token ever passes through the ntfy server.
      required: [title, body, category, deep_link, level]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 300 }
        category:
          type: string
          enum: [approval, task, broke, digest, note]
          description: |
            `note` is a plain notice: Marcel's own (the brain's `notify` tool, at most 6 per hour per
            agent, the rest dropped and logged, so a looping brain cannot flood the phone) and the
            hub's own, such as the usage guard pausing new work (`marcel://status`, collapse key
            `usage`) or a scheduled job that did not run or ran late (`normal`, linking to the
            `system` message about it in the main conversation, collapse key `schedules_missed` or
            `late:<schedule id>`). `broke` is only for system faults (one per cause per hour).
        level:
          type: string
          enum: [normal, urgent]
          description: '`urgent` for approvals and broken things; `normal` for done and digests.'
        deep_link:
          type: string
          pattern: '^marcel://((task|message|approval|artifact)/[A-Za-z0-9_-]+|project/[a-z0-9][a-z0-9-]{0,39}|status)$'
        collapse_key:
          type: string
          description: A newer push with the same key replaces the older one (one per task or cause).
        task_id: { type: string }
        approval_id: { type: string }
      if: { properties: { category: { const: approval } } }
      then: { required: [approval_id, task_id] }
      example:
        title: Marcel needs you
        body: 'Check disk usage: allow `docker system df -v`?'
        category: approval
        level: urgent
        deep_link: marcel://approval/apr_01J9ZR2
        collapse_key: tsk_01J9ZQ6
        task_id: tsk_01J9ZQ6
        approval_id: apr_01J9ZR2

    UsageWindow:
      type: object
      required: [used_pct]
      additionalProperties: false
      properties:
        used_pct: { type: number, minimum: 0, maximum: 100 }
        resets_at: { type: string, format: date-time }
      example: { used_pct: 62.5, resets_at: '2026-10-04T21:00:00Z' }

    Usage:
      type: object
      required: [five_hour, weekly, source, stale, guard]
      additionalProperties: false
      properties:
        five_hour: { $ref: '#/components/schemas/UsageWindow' }
        weekly: { $ref: '#/components/schemas/UsageWindow' }
        source:
          type: string
          description: Where the reading came from (decided by spike SP4).
        stale:
          type: boolean
          description: True when the latest reading is too old to trust.
        taken_at: { type: string, format: date-time }
        guard:
          type: object
          required: [active, queued]
          additionalProperties: false
          properties:
            active:
              type: boolean
              description: True while new work is being held back.
            reason:
              type: string
              description: In plain words, with the reset time.
            queued:
              type: integer
              minimum: 0
              description: Tasks waiting for the reset.
      example:
        five_hour: { used_pct: 91.0, resets_at: '2026-10-04T21:00:00Z' }
        weekly: { used_pct: 48.2, resets_at: '2026-10-07T09:00:00Z' }
        source: statusline
        stale: false
        taken_at: '2026-10-04T18:40:00Z'
        guard:
          active: true
          reason: Plan usage is at 91 %. New tasks wait until 23:00.
          queued: 2

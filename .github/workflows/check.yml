# Every lane's gate on every PR and every push to main. iOS runs on the Mac (`make ios-check`).
# Runs every lane, not just the one a PR touches: a hub change can break the plugin tools
# (project/lessons/cross-lane-gates.md). The job list comes from `make ci-lanes`, so a lane added
# to `make check` is in CI too. No Claude, no network beyond package installs.
name: check

on:
  pull_request:
  push:
    branches: [main]

# A newer push cancels an older PR run. On main each commit is its own group, so every commit gets a
# full run and none looks red because a later push cancelled it.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lanes:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(make -s ci-lanes | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  python:
    name: ${{ matrix.lane }}
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.lanes.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: make ${{ matrix.lane }}

  channel:
    name: plugins/marcel/channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/marcel/channel/package-lock.json
      - run: make channel

  relay:
    name: relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: make relay

  # The one status branch protection requires: green only when every lane above is green.
  check:
    if: always()
    needs: [python, channel, relay]
    runs-on: ubuntu-latest
    steps:
      - run: >-
          test "${{ needs.python.result }}" = success && test "${{ needs.channel.result }}" = success
          && test "${{ needs.relay.result }}" = success

# Every lane's gate on every PR and every push to main. iOS runs on the Mac (`make ios-check`).
# Runs every lane, not just the one a PR touches: a hub change can break the plugin tools
# (project/lessons/cross-lane-gates.md). No Claude, no network beyond package installs.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [scripts, brain, contracts, hub, mock-hub-check, runner, plugins/marcel/tools, shared/avatar/pixel]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: make ${{ matrix.lane }}

  channel:
    name: plugins/marcel/channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/marcel/channel/package-lock.json
      - run: make channel

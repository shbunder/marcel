[project]
name = "marcel-hub"
version = "0.1.0"
description = "Marcel hub: state, app API, channel gateway and scheduler. Runs in Docker on the NUC."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "pyright>=1.1.380", "pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marcel_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: reaches a real claude, network or device; never part of the gate"]

[tool.coverage.run]
source = ["marcel_hub"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
